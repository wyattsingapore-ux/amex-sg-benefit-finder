name: Refresh Eatigo today offers hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore current production merchant data
        run: |
          mkdir -p data
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          curl --fail --location --retry 4 --retry-delay 2 "$base/data/merchants.json" --output data/merchants.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/merchants.json').read_text(encoding='utf-8')).get('merchants',[])
          eatigo=[m for m in rows if m.get('eatigo') and m.get('eatigo_url')]
          print(f'Production Eatigo directory rows={len(eatigo)}')
          if len(eatigo)<200:
              raise SystemExit('Refusing hourly refresh until production has the full Eatigo directory')
          PY

      - name: Refresh today's Eatigo offers
        run: python scripts/refresh_eatigo_today.py --limit 0 --workers 8

      - name: Verify hourly snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/eatigo_today.json').read_text(encoding='utf-8'))
          attempted=int(d.get('restaurants_attempted') or 0)
          errors=int(d.get('request_errors') or 0)
          print(f'attempted={attempted} future_slots={d.get("restaurants_with_future_slots")} cuisines={d.get("restaurants_with_cuisine")} errors={errors} seconds={d.get("refresh_seconds")}')
          if attempted<200:
              raise SystemExit('Hourly Eatigo snapshot is incomplete')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy hourly Eatigo snapshot
        uses: actions/deploy-pages@v4
