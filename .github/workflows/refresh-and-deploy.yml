name: Refresh AMEX + GHA + Eatigo data and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *' # 10:17 AM Singapore time (UTC+8)
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve last-known-good merchant data
        run: |
          if [ -f data/merchants.json ]; then
            cp data/merchants.json "$RUNNER_TEMP/merchants-last-good.json"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium for Eatigo pagination (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m playwright install --with-deps chromium 2>&1 | tee chromium-install.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "Automated diagnostic from GitHub Actions run $GITHUB_RUN_NUMBER."
              echo
              echo '```text'
              tail -n 220 chromium-install.log
              echo '```'
            } > chromium-failure.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Eatigo Chromium setup failure - run $GITHUB_RUN_NUMBER" --body-file chromium-failure.md || true
            echo "::warning::Chromium setup failed. The site will still deploy using last-known-good merchant data."
          fi

      - name: Restore OneMap and Eatigo caches
        uses: actions/cache@v4
        with:
          path: |
            data/geocodes.json
            data/eatigo_branch_cache.json
            data/eatigo_snapshot.json
          key: dining-data-caches-${{ github.run_id }}
          restore-keys: |
            dining-data-caches-
            onemap-geocodes-

      - name: Refresh merchant data transactionally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          data_ok=1

          python -m scripts.refresh_data_fixed
          if [ "$?" -ne 0 ]; then
            echo "::warning::AMEX refresh failed; reverting to last-known-good merchant data."
            data_ok=0
          fi

          if [ "$data_ok" -eq 1 ]; then
            python -m scripts.augment_gha
            if [ "$?" -ne 0 ]; then
              echo "::warning::GHA refresh failed; reverting to last-known-good merchant data."
              data_ok=0
            fi
          fi

          if [ "$data_ok" -eq 1 ]; then
            python -m scripts.augment_eatigo_resilient_v2 2>&1 | tee eatigo-run.log
            eatigo_status=${PIPESTATUS[0]}
            if [ "$eatigo_status" -ne 0 ]; then
              {
                echo "Automated diagnostic from GitHub Actions run $GITHUB_RUN_NUMBER."
                echo
                echo '```text'
                tail -n 220 eatigo-run.log
                echo '```'
              } > eatigo-failure.md
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Eatigo refresh failure - run $GITHUB_RUN_NUMBER" --body-file eatigo-failure.md || true
              echo "::warning::Eatigo refresh failed; reverting to last-known-good merchant data so UI changes can still deploy."
              data_ok=0
            fi
          fi

          if [ "$data_ok" -ne 1 ]; then
            if [ -f "$RUNNER_TEMP/merchants-last-good.json" ]; then
              cp "$RUNNER_TEMP/merchants-last-good.json" data/merchants.json
              echo "Restored last-known-good data/merchants.json."
            else
              echo "::error::No last-known-good merchant dataset is available."
              exit 1
            fi
          fi
          set -e

      - name: Verify OneMap repository secrets
        env:
          ONEMAP_API_EMAIL: ${{ secrets.ONEMAP_API_EMAIL }}
          ONEMAP_API_PASSWORD: ${{ secrets.ONEMAP_API_PASSWORD }}
        run: |
          if [ -z "$ONEMAP_API_EMAIL" ] || [ -z "$ONEMAP_API_PASSWORD" ]; then
            echo "::error::OneMap credentials are not available to the build job. Add ONEMAP_API_EMAIL and ONEMAP_API_PASSWORD under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "OneMap repository secrets are available to the build job."

      - name: Geocode with OneMap
        env:
          ONEMAP_API_EMAIL: ${{ secrets.ONEMAP_API_EMAIL }}
          ONEMAP_API_PASSWORD: ${{ secrets.ONEMAP_API_PASSWORD }}
        run: python scripts/geocode.py

      - name: Verify mapped merchant coordinates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/merchants.json').read_text(encoding='utf-8'))
          merchants = payload.get('merchants', [])
          mapped = sum(m.get('lat') is not None and m.get('lng') is not None for m in merchants)
          print(f'Mapped merchants: {mapped}/{len(merchants)}')
          if mapped == 0:
              raise SystemExit('Geocoding produced zero mapped merchants; refusing to deploy an empty map.')
          PY

      - run: python scripts/validate_data.py
      - run: python -m pytest -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
