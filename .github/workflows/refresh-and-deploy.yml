name: Refresh AMEX + GHA data and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *' # 10:17 AM Singapore time (UTC+8)
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore OneMap geocode cache
        uses: actions/cache@v4
        with:
          path: data/geocodes.json
          key: onemap-geocodes-${{ github.run_id }}
          restore-keys: |
            onemap-geocodes-
      - name: Refresh official AMEX merchant sources
        run: python -m scripts.refresh_data_fixed
      - name: Add official GHA / Pan Pacific DISCOVERY dining outlets
        run: python -m scripts.augment_gha
      - name: Verify OneMap repository secrets
        env:
          ONEMAP_API_EMAIL: ${{ secrets.ONEMAP_API_EMAIL }}
          ONEMAP_API_PASSWORD: ${{ secrets.ONEMAP_API_PASSWORD }}
        run: |
          if [ -z "$ONEMAP_API_EMAIL" ] || [ -z "$ONEMAP_API_PASSWORD" ]; then
            echo "::error::OneMap credentials are not available to the build job. Add ONEMAP_API_EMAIL and ONEMAP_API_PASSWORD under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "OneMap repository secrets are available to the build job."
      - name: Geocode with OneMap
        env:
          ONEMAP_API_EMAIL: ${{ secrets.ONEMAP_API_EMAIL }}
          ONEMAP_API_PASSWORD: ${{ secrets.ONEMAP_API_PASSWORD }}
        run: python scripts/geocode.py
      - name: Verify mapped merchant coordinates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/merchants.json').read_text(encoding='utf-8'))
          merchants = payload.get('merchants', [])
          mapped = sum(m.get('lat') is not None and m.get('lng') is not None for m in merchants)
          print(f'Mapped merchants: {mapped}/{len(merchants)}')
          if mapped == 0:
              raise SystemExit('Geocoding produced zero mapped merchants; refusing to deploy an empty map.')
          PY
      - run: python scripts/validate_data.py
      - run: python -m pytest -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
