name: Refresh AMEX data and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *' # 10:17 AM Singapore time (UTC+8)
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore OneMap geocode cache
        uses: actions/cache@v4
        with:
          path: data/geocodes.json
          key: onemap-geocodes-${{ github.run_id }}
          restore-keys: |
            onemap-geocodes-
      - name: Refresh official AMEX merchant sources
        run: python scripts/refresh_data.py
      - name: Geocode with OneMap
        env:
          ONEMAP_API_EMAIL: ${{ secrets.ONEMAP_API_EMAIL }}
          ONEMAP_API_PASSWORD: ${{ secrets.ONEMAP_API_PASSWORD }}
        run: python scripts/geocode.py
      - run: python scripts/validate_data.py
      - run: python -m pytest -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
